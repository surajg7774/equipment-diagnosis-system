# Render Blueprint for the BACKEND (the frontend goes on Vercel; see README "Deployment").
# Render dashboard: New > Blueprint > pick this repo. Variables marked `sync: false` are
# prompted for in the dashboard (secrets / values only you know) and are never stored in git.
#
# Why this fits a free instance (512 MB RAM, 0.1 CPU): the embedding model runs on the ONNX
# runtime bundled with ChromaDB (~210 MB resident) instead of PyTorch (~750 MB). Measured peak
# for the whole app is documented in the README.
services:
  - type: web
    name: servicediagnose-api
    runtime: python
    plan: free                  # 512 MB / 0.1 CPU. Spins down after 15 min idle (~1 min cold start).
    # If the repo root is not this folder, add:  rootDir: <path to the folder containing app/>
    # The build also downloads the ~80 MB embedding model into ./models (EMBEDDING_MODEL_DIR below). Without this the
    # model is downloaded on the first embedding after every cold start, because the free disk is wiped when the service
    # sleeps. A failed download only prints a warning here; the app then downloads it at start-up as before.
    buildCommand: pip install -r requirements.txt && python scripts/download_embedding_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only (no database / vector store / LLM checks): a Groq outage must not make Render
    # restart a healthy server. Use /health yourself for full diagnostics.
    healthCheckPath: /health/live
    autoDeployTrigger: commit   # redeploy on every push (replaces the deprecated `autoDeploy: true`)
    envVars:
      # ---- required --------------------------------------------------------------------------
      - key: PYTHON_VERSION     # a fully qualified version is required; this is what it was tested on
        value: 3.13.5
      - key: LLM_PROVIDER       # "groq" in production ("ollama" is for local development only)
        value: groq
      - key: GROQ_API_KEY       # SECRET. Paste in the dashboard: https://console.groq.com/keys
        sync: false
      - key: ALLOWED_ORIGINS    # your deployed frontend, e.g. https://my-app.vercel.app (no path)
        sync: false             # comma-separate several; trailing slashes are ignored

      # ---- recommended (these are also the defaults) ---------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT   # "low" keeps the reasoning model fast; empty for non-reasoning models
        value: low
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: VISION_PROVIDER    # photo analysis via Groq (same GROQ_API_KEY); "none" disables it
        value: groq
      - key: GROQ_VISION_MODEL  # must accept image input; free tier allows only ~3 images/minute
        value: qwen/qwen3.8-27b
      - key: EMBEDDING_BACKEND  # "onnx" = no PyTorch, fits in 512 MB
        value: onnx
      - key: EMBEDDING_MODEL_DIR    # where the build puts the model; the app finds it here at start-up (no download)
        value: ./models
      - key: AUTO_SEED_ON_STARTUP   # refill the knowledge base on boot (the free disk is wiped on restart)
        value: "true"
      - key: MAX_SOLUTION_ATTEMPTS  # different solutions per problem before "escalate to a human technician"
        value: "4"
      # Confirmations a fix needs to count as VERIFIED: a user's click = 1, a technician's review = 2. With 2 a lone
      # click stays "provisional". KILL SWITCH: set this to 1 in the dashboard and redeploy to get the old behaviour.
      - key: MIN_CONFIRMATIONS_TO_VERIFY
        value: "2"
      # TECHNICIAN_ACCESS_CODE (SECRET): set it in the Render dashboard (Environment), NOT here. When set, Verify/Confirm and
      # Correct need it in an X-Technician-Code header (401 otherwise). Left out, those two endpoints stay open. It is
      # not listed as a `sync: false` key on purpose: that would make a Blueprint sync prompt for it and block the deploy.
      # Remove the variable to switch the gate off again. Note: changing a variable restarts the service (free tier: resets data).
      - key: RATE_LIMIT_PER_MINUTE  # per client, on /diagnose, /diagnose-image and each "No" in a session; 0 turns it off
        value: "10"
      # Render's proxy puts the caller's address into X-Forwarded-For. 1 = "trust the last entry".
      # Too low only makes clients share a bucket; too high would let a client forge its address.
      # After deploying, look for the `rate_limit_new_client` log lines (they show the key it derived).
      - key: RATE_LIMIT_PROXY_HOPS
        value: "1"
      # Both live on the ephemeral disk: tickets/feedback and the vector store reset whenever the
      # service restarts, redeploys or spins down. Fine for a demo; see README for durable options.
      - key: DATABASE_URL
        value: sqlite:///./servicediagnose.db
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: LOG_LEVEL
        value: INFO

      # ---- documented but UNUSED in production (only read when LLM_PROVIDER=ollama) -------------
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: llama3.2:3b
